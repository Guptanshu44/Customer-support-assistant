ன் உடனடியாக உதவுகிறேன். 📦 தயவுசெய்து உங்கள் ஆர்டர் ஐடியை (Order ID) பகிர முடியுமா? நான் இப்போதே நேரடி டிராக்கிங் செய்து சரியான டெலிவரி விவரங்களை உங்களுக்கு வழங்குகிறேன்!`,telugu:`${h}మీ ఆర్డర్ స్థితిని తనిఖీ చేయడానికి నేను మీకు సహాయం చేస్తాను. 📦 దయచేసి మీ ఆర్డర్ ఐడీని (Order ID) తెలియజేయగలరా? నేను ఇప్పుడే సిస్టమ్‌లో లైవ్ ట్రాకింగ్ చెక్ చేసి సరైన డెలివరీ వివరాలను మీకు అందిస్తాను!`,kannada:`${h}ನಿಮ್ಮ ಆರ್ಡರ್ ಸ್ಥಿತಿಯನ್ನು ಪರಿಶೀಲಿಸಲು ನಾನು ನಿಮಗೆ ತಕ್ಷಣ ಸಹಾಯ ಮಾಡುತ್ತೇನೆ. 📦 ದಯವಿಟ್ಟು ನಿಮ್ಮ ಆರ್ಡರ್ ಐಡಿಯನ್ನು (Order ID) ಹಂಚಿಕೊಳ್ಳಿ, ನಾನು ಲೈವ್ ಟ್ರ್ಯಾಕಿಂಗ್ ಪರಿಶೀಲಿಸಿ ನಿಖರವಾದ ಡೆಲಿವರಿ ವಿವರಗಳನ್ನು ನೀಡುತ್ತೇನೆ!`,malayalam:`${h}നിങ്ങളുടെ ഓർഡർ നില പരിശോധിക്കാൻ ഞാൻ സഹായിക്കാം. 📦 ദയവായി താങ്കളുടെ ഓർഡർ ഐഡി (Order ID) പങ്കുവെക്കാമോ? ഞാൻ ഉടൻ തന്നെ ലൈവ് ട്രാക്കിംഗ് പരിശോധിച്ച് കൃത്യമായ ഡെലിവറി വിവരം അറിയിക്കാം!`,bengali:`${h}আপনার অর্ডারের স্থিতি পরীক্ষা করতে আমি সম্পূর্ণ সাহায্য করব। 📦 দয়া করে আপনার অর্ডার আইডি (Order ID) শেয়ার করুন, আমি এখনই লাইভ ট্র্যাকিং চেক করে সঠিক ডেলিভারির তথ্য জানাচ্ছি!`,english:`${h}I apologize for the trouble with your order. 😔 I will investigate this right away. Could you please share your order ID so I can check the exact status and give you a precise update? I want to make sure this gets resolved immediately for you!`},payment:{hindi:`${h}असुविधा के लिए हमें गहरा खेद है। 😔 हमने आपके खाते की जाँच कर ली है और समस्या की पुष्टि हो गई है — हम तुरंत रिफंड की प्रक्रिया शुरू कर रहे हैं। यह राशि 3–5 कार्य दिवसों में आपके बैंक खाते में वापस आ जाएगी और आपको एक पुष्टिकरण ईमेल भी मिलेगा। क्या आपको कोई अन्य सहायता चाहिए?`,tamil:`${h}ஏற்பட்ட சிரமத்திற்கு நாங்கள் மிகவும் வருந்துகிறோம். 😔 உங்கள் கணக்கை நாங்கள் சரிபார்த்து விட்டோம் — உடனடியாக உங்கள் பணத்தை ரீபண்ட் செய்கிறோம். இது 3–5 வணிக நாட்களில் உங்கள் வங்கிக் கணக்கில் வரவு வைக்கப்படும். உறுதிப்படுத்தல் மின்னஞ்சலும் உங்களுக்கு அனுப்பப்படும்.`,telugu:`${h}మీకు కలిగిన అసౌకర్యానికి మేము చింతిస్తున్నాము. 😔 మీ సమస్యను మేము ధృవీకరించాము — మేము వెంటనే రీఫండ్ ప్రక్రియను ప్రారంభిస్తున్నాము. ఇది 3–5 పని దినాలలో మీ బ్యాంక్ ఖాతాలో జమ అవుతుంది మరియు మీకు నిర్ధారణ ఇమెయిల్ అందుతుంది.`,kannada:`${h}ನಿಮಗುಂಟಾದ ತೊಂದರೆಗೆ ನಾವು ಕ್ಷಮೆಯಾಚಿಸುತ್ತೇವೆ. 😔 ನಿಮ್ಮ ಖಾತೆಯನ್ನು ನಾವು ಪರಿಶೀಲಿಸಿದ್ದೇವೆ — ತಕ್ಷಣವೇ ಮರುಪಾವತಿ (ರೀಫಂಡ್) ಪ್ರಕ್ರಿಯೆ ಪ್ರಾರಂಭಿಸಲಾಗಿದೆ. ಇದು 3-5 ಕೆಲಸದ ದಿನಗಳಲ್ಲಿ ನಿಮ್ಮ ಖಾತೆಗೆ ಜಮೆಯಾಗಲಿದೆ. ನಿಮಗೆ ದೃಢೀಕರಣ ಇಮೇಲ್ ಕೂಡ ಬರಲಿದೆ.`,malayalam:`${h}നിങ്ങൾക്കുണ്ടായ അസൗകര്യത്തിൽ ഞങ്ങൾ ഖേദിക്കുന്നു. 😔 നിങ്ങളുടെ അക്കൗണ്ട് പരിശോധിച്ച് പ്രശ്നം സ്ഥിരീകരിച്ചു — റീഫണ്ട് നടപടികൾ ഉടൻ ആരംഭിക്കുന്നു. ഇത് 3–5 പ്രവൃത്തി ദിവസങ്ങൾക്കുള്ളിൽ അക്കൗണ്ടിൽ ലഭ്യമാകും. സ്ഥിരീകരണ ഇമെയിലും ലഭിക്കും.`,bengali:`${h}অসুবিধার জন্য আমরা আন্তরিকভাবে দুঃখিত। 😔 আমরা এখনই রিফান্ড প্রক্রিয়া শুরু করছি, যা ৩-৫ কার্যদিবসের মধ্যে আপনার মূল পেমেন্ট পদ্ধতিতে জমা হবে এবং আপনি একটি নিশ্চিতকরণ ইমেল পাবেন।`,english:`${h}I sincerely apologize for the inconvenience. 😔 I completely understand how frustrating an unexpected charge can be. I have reviewed your account and confirmed the issue — I will process the refund immediately. It will reflect in your account within 3–5 business days, and you will receive a confirmation email. Is there anything else I can help you with?`},pricing:{hindi:`${h}हमारी सेवाओं में रुचि दिखाने के लिए धन्यवाद! 😊 हम टीम और बिजनेस प्लान्स पर वॉल्यूम डिस्काउंट प्रदान करते हैं — वार्षिक बिलिंग पर 15+ सीटों के लिए 18% और 25+ सीटों पर 22% की छूट उपलब्ध है। क्या मैं आपकी टीम के लिए सर्वोत्तम प्लान निर्धारित करने हेतु एक त्वरित कॉल तय कर दूँ?`,tamil:`${h}எங்கள் திட்டங்களில் ஆர்வம் காட்டியதற்கு நன்றி! 😊 வருடாந்திர கட்டணத்தில் 15+ பயனர்களுக்கு 18% மற்றும் 25+ பயனர்களுக்கு 22% தள்ளுபடி வழங்குகிறோம். உங்கள் நிறுவனத்திற்கான சிறந்த திட்டத்தை தேர்வு செய்ய ஒரு அழைப்பை திட்டமிடவா?`,telugu:`${h}మా సేవలపై ఆసక్తి చూపినందుకు ధన్యవాదాలు! 😊 వార్షిక బిల్లింగ్‌లో 15+ సీట్లకు 18% మరియు 25+ సీట్లకు 22% తగ్గింపును మేము అందిస్తున్నాము. మీ బృందానికి ఉత్తమ ప్లాన్ నిర్ణయించడానికి ఒక కాల్ షెడ్యూల్ చేయమంటారా?`,kannada:`${h}ನಮ್ಮ ಸೇವೆಗಳಲ್ಲಿ ಆಸಕ್ತಿ ತೋರಿಸಿದ್ದಕ್ಕಾಗಿ ಧನ್ಯವಾದಗಳು! 😊 ವಾರ್ಷಿಕ ಬಿಲ್ಲಿಂಗ್‌ನಲ್ಲಿ 15+ ಬಳಕೆದಾರರಿಗೆ 18% ಮತ್ತು 25+ ಬಳಕೆದಾರರಿಗೆ 22% ರಿಯಾಯಿತಿ ಲಭ್ಯವಿದೆ. ನಿಮ್ಮ ತಂಡಕ್ಕೆ ಸೂಕ್ತವಾದ ಯೋಜನೆಯನ್ನು ಆಯ್ಕೆ ಮಾಡಲು ತ್ವರಿತ ಕರೆ ನಿಗದಿಪಡಿಸಬೇಕೆ?`,malayalam:`${h}ഞങ്ങളുടെ പ്ലാനുകളിൽ താൽപ്പര്യം പ്രകടിപ്പിച്ചതിന് നന്ദി! 😊 വാർഷിക ബില്ലിംഗിൽ 15+ സീറ്റുകൾക്ക് 18% കിഴിവും 25+ സീറ്റുകൾക്ക് 22% കിഴിവും ലഭിക്കും. നിങ്ങളുടെ ടീമിനായി മികച്ച പ്ലാൻ തിരഞ്ഞെടുക്കാൻ ഒരു കോൾ ക്രമീകരിക്കട്ടെ?`,bengali:`${h}আমাদের সেবায় আগ্রহ দেখানোর জন্য ধন্যবাদ! 😊 বার্ষিক বিলিংয়ে ১৫+ সিটের জন্য ১৮% এবং ২৫+ সিটের জন্য ২২% বিশেষ ছাড় পাওয়া যাবে। আপনার দলের জন্য সেরা প্ল্যান নির্ধারণে একটি কল শিডিউল করব কি?`,english:`${h}Thank you for your interest! 😊 We do offer volume discounts — teams with 15 or more seats on annual billing receive an 18% discount, and 25+ seats get 22% off. I would be happy to walk you through all the options. Shall I set up a quick call with our accounts team to find the best plan for you?`},cancel:{hindi:`${h}यह जानकर हमें खेद है कि आप सेवा/ऑर्डर रद्द करना चाहते हैं। 😔 क्या आप कृपया बता सकते हैं कि इस निर्णय का क्या कारण है? यदि कोई परेशानी आई है, तो हम तुरंत समाधान कर सकते हैं या 1 महीने का मानार्थ बिलिंग क्रेडिट दे सकते हैं, अन्यथा हम तुरंत कैंसिलेशन पूरा कर देंगे।`,tamil:`${h}நீங்கள் சேவையை/ஆர்டரை ரத்து செய்ய விரும்புவது அறிந்து வருந்துகிறோம். 😔 இதன் காரணத்தை தயவுசெய்து கூற முடியுமா? ஏதேனும் சிக்கல் இருந்தால் நாங்கள் உடனே சரிசெய்கிறோம் அல்லது 1 மாத இலவச சேவை வழங்குகிறோம்.`,telugu:`${h}మీరు సర్వీస్/ఆర్డర్ రద్దు చేయాలనుకుంటున్నారని తెలిసి విచారిస్తున్నాము. 😔 దీని వెనుక ఉన్న కారణాన్ని దయచేసి పంచుకోగలరా? సమస్యను వెంటనే పరిష్కరించడానికి లేదా 1 నెల ఉచిత క్రెడిట్ అందించడానికి మేము సిద్ధంగా ఉన్నాము.`,kannada:`${h}ನೀವು ಚಂದಾದಾರಿಕೆ/ಆರ್ಡರ್ ರದ್ದುಗೊಳಿಸಲು ಬಯಸಿದ್ದಕ್ಕೆ ನಮಗೆ ವಿಷಾದವಿದೆ. 😔 ಇದಕ್ಕೆ ಕಾರಣವೇನು ಎಂದು ದಯವಿಟ್ಟು ತಿಳಿಸುವಿರಾ? ಯಾವುದೇ ತೊಂದರೆ ಇದ್ದಲ್ಲಿ ನಾವು ಅದನ್ನು ಸರಿಪಡಿಸುತ್ತೇವೆ ಅಥವಾ 1 ತಿಂಗಳ ಉಚಿತ ಕ್ರೆಡಿಟ್ ನೀಡುತ್ತೇವೆ.`,malayalam:`${h}താങ്കൾ സർവീസ്/ഓർഡർ റദ്ദാക്കാൻ ആഗ്രഹിക്കുന്നു എന്നറിഞ്ഞതിൽ വിഷമമുണ്ട്. 😔 ഇതിന്റെ കാരണം വ്യക്തമാക്കാമോ? പ്രശ്നമുണ്ടെങ്കിൽ ഉടനടി പരിഹരിക്കാനോ 1 മാസത്തെ സൗജന്യ ക്രെഡിറ്റ് നൽകാനോ ഞങ്ങൾ തയ്യാറാണ്.`,bengali:`${h}আপনি অর্ডার/সাবস্ক্রিপশন বাতিল করতে চাইছেন জেনে আমরা আন্তরিকভাবে দুঃখিত। 😔 দয়া করে এর কারণ জানাতে পারেন? আমরা সমস্যা সমাধান করতে বা ১ মাসের ফ্রি ক্রেডিট দিতে আগ্রহী।`,english:`${h}I'm sorry to hear you're considering cancellation. 😔 I want to make sure any concerns are fully addressed first. Could you tell me what prompted this decision? I'd love to see if we can find a solution that works better for you.`},general:{hindi:`${h}हम आपकी सहायता के लिए सदैव तत्पर हैं! 😊 कृपया अपनी समस्या का थोड़ा और विवरण साझा करें ताकि हम तुरंत इसकी जाँच कर आपको सर्वोत्तम समाधान प्रदान कर सकें।`,tamil:`${h}நாங்கள் உங்களுக்கு உதவ எப்போதும் தயாராக இருக்கிறோம்! 😊 உங்கள் பிரச்சனையைப் பற்றி மேலும் சில விவரங்களை கூறினால், நாங்கள் சிறந்த தீர்வை உடனே வழங்குவோம்.`,telugu:`${h}మీకు సహాయం చేయడానికి మేము సిద్ధంగా ఉన్నాము! 😊 దయచేసి మీ సమస్య గురించిన మరిన్ని వివరాలను తెలియజేయండి, తద్వారా మేము ఉత్తమ పరిష్కారాన్ని వెంటనే అందించగలము.`,kannada:`${h}ನಾವು ನಿಮಗೆ ಸಹಾಯ ಮಾಡಲು ಸದಾ ಸಿದ್ಧರಿದ್ದೇವೆ! 😊 ದಯವಿಟ್ಟು ನಿಮ್ಮ ಸಮಸ್ಯೆಯ ಬಗ್ಗೆ ಹೆಚ್ಚಿನ ವಿವರಗಳನ್ನು ನೀಡಿ, ಇದರಿಂದ ನಾವು ನಿಮಗೆ ಅತ್ಯುತ್ತಮ ಪರಿಹಾರ ನೀಡಬಹುದು.`,malayalam:`${h}ഞങ്ങൾ നിങ്ങളെ സഹായിക്കാൻ സദാ സന്നദ്ധരാണ്! 😊 കൂടുതൽ വിവരങ്ങൾ പങ്കുവെച്ചാൽ ഏറ്റവും അനുയോജ്യമായ പരിഹാരം ഉടൻ നൽകാം.`,bengali:`${h}আমরা আপনাকে সাহায্য করতে সর্বদা প্রস্তুত! 😊 আপনার সমস্যাটি একটু বিস্তারিত জানালে আমরা দ্রুত সবচেয়ে ভালো সমাধান প্রদান করতে পারব।`,english:`${h}I'm here to help and want to make sure your concern is fully resolved! 😊 Could you please share a bit more detail so I can look into this right away and provide you with the best solution?`}},x=j[a]||j.general;return x[c]||x.english}function Iu(a,c){const u={payment:{hindi:"बिलिंग समस्या के लिए पहले सहानुभूति व्यक्त करें। रिफंड की समय-सीमा (3-5 दिन) स्पष्ट रूप से बताएं।",tamil:"பில்லிங் சிக்கல்களுக்கு முதலில் பரிவு காட்டுங்கள். ரீஃபண்ட் காலவரிசையை (3-5 நாட்கள்) தெளிவாக கூறுங்கள்.",telugu:"బిల్లింగ్ సమస్యల కోసం ముందుగా సానుభూతిని వ్యక్తం చేయండి. రీఫండ్ కాలక్రమాన్ని స్పష్టంగా చెప్పండి.",kannada:"ಬಿಲ್ಲಿಂಗ್ ಸಮಸ್ಯೆಗಳಿಗೆ ಮೊದಲು ಸಹಾನುಭೂತಿ ವ್ಯಕ್ತಪಡಿಸಿ. ಮರುಪಾವತಿ ಸಮಯವನ್ನು ಸ್ಪಷ್ಟವಾಗಿ ತಿಳಿಸಿ.",malayalam:"ബില്ലിംഗ് പ്രശ്നങ്ങൾക്ക് ആദ്യം സഹതാപം പ്രകടിപ്പിക്കുക. റീഫണ്ട് കാലപരിധി വ്യക്തമാക്കുക.",bengali:"বিলিং সমস্যার ক্ষেত্রে প্রথমে সহানুভূতি প্রকাশ করুন। রিফান্ডের সঠিক সময়সীমা স্পষ্টভাবে জানান।",english:"Lead with empathy for billing issues. Confirm the problem clearly, take ownership, and provide an exact refund timeline."},delivery:{hindi:"ऑर्डर या डिलीवरी की जानकारी के लिए पहले ग्राहक से ऑर्डर आईडी मांगें, फिर ट्रैकिंग स्थिति की जाँच करें।",tamil:"டெலிவரி தொடர்பான கேள்விகளுக்கு முதலில் ஆர்டர் ஐடியைக் கேட்டு, பின்னர் டிராக்கிங் நிலையை சரிபார்க்கவும்.",telugu:"డెలివరీ ప్రశ్నల కోసం మొదట ఆర్డర్ ఐడీని అడగండి, ఆపై ట్రాకింగ్ స్థితిని తనిఖీ చేయండి.",kannada:"ಡೆಲಿವರಿ ವಿಚಾರಗಳಿಗೆ ಮೊದಲು ಆರ್ಡರ್ ಐಡಿ ಕೇಳಿ, ನಂತರ ಟ್ರ್ಯಾಕಿಂಗ್ ಪರಿಶೀಲಿಸಿ.",malayalam:"ഡെലിവറി സംശയങ്ങൾക്ക് ആദ്യം ഓർഡർ ഐഡി ചോദിക്കുക, തുടർന്ന് ട്രാക്കിംഗ് പരിശോധിക്കുക.",bengali:"ডেলিভারি সম্পর্কিত প্রশ্নের জন্য প্রথমে গ্রাহকের কাছে অর্ডার আইডি চান, তারপর ট্র্যাকিং স্ট্যাটাস চেক করুন।",english:"For order/delivery issues, ask for the order ID first, then check tracking. Reassure the customer you are actively on it."},pricing:{hindi:"मूल्य निर्धारण से जुड़े प्रश्न अपसेल का बेहतरीन अवसर हैं। सीट डिस्काउंट टियर्स स्पष्ट रूप से समझाएं।",tamil:"விலை தொடர்பான விசாரணைகள் விற்பனை வாய்ப்புகள். தள்ளுபடி நிலைகளை தெளிவாக விளக்குங்கள்.",telugu:"ధర విచారణలు అప్‌సెల్ అవకాశాలు. డిస్కౌంట్ శ్రేణులను స్పష్టంగా వివరించండి.",kannada:"ಬೆಲೆ ವಿಚಾರಣೆಗಳು ಉತ್ತಮ ಅವಕಾಶಗಳು. ರಿಯಾಯಿತಿ ಹಂತಗಳನ್ನು ಸ್ಪಷ್ಟವಾಗಿ ವಿವರಿಸಿ.",malayalam:"വില അന്വേഷണങ്ങൾ അപ്സെൽ അവസരങ്ങളാണ്. കിഴിവ് നിരക്കുകൾ വ്യക്തമായി വിശദീകരിക്കുക.",bengali:"মূল্য সংক্রান্ত প্রশ্ন আপসেলের দারুণ সুযোগ। ডিসকাউন্ট স্তরগুলো স্পষ্টভাবে উপস্থাপন করুন।",english:"Pricing queries are upsell opportunities. Be specific about discount tiers and offer a consultation call."},cancel:{hindi:"रद्द करने से पहले ग्राहक को बनाए रखने का प्रयास अवश्य करें। विकल्प के रूप में मानार्थ पॉज़ दें।",tamil:"ரத்து செய்வதற்கு முன் தக்கவைக்க முயற்சிக்கவும். இலவச இடைநிறுத்தத்தை மாற்றாக வழங்கவும்.",telugu:"రద్దు చేయడానికి ముందు నిలు
